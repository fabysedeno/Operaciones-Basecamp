-1));return [0,1,2,3,4].map(i=>add(ymdl(x),i))})();\nlet dia=Math.max(0,SEM.indexOf(ymdl(new Date()))),who=0,fijos=[],FIJOS=0;\nlet plan=[],cola=[],pausas=[],imps=[],ign=new Set();\nconst MS=(()=>{try{const P=window.parent;if(P&&P!==window){P.__mstore=P.__mstore||{days:{},db:false};return P.__mstore}}catch(e){}return {days:{},db:false}})();\nconst EVS=()=>{try{return (window.parent.__eventos||[]).filter(e=>!e.bcRemoved)}catch(e){return []}};\nconst rkey=()=>AREA+\"|\"+SEM[dia]+(who===1?\"|a\":\"\");\nconst hh=d=>d.toLocaleTimeString(\"es-MX\",{hour:\"2-digit\",minute:\"2-digit\",hour12:false});\nconst fm=m=>m>=60?Math.floor(m/60)+\" h\"+(Math.round(m%60)?\" \"+Math.round(m%60)+\" min\":\"\"):Math.round(m)+\" min\";\nfunction toast(x){const t=$(\"#toast\");t.textContent=x;t.classList.add(\"on\");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove(\"on\"),2400)}\nfunction evActs(f){const o=[];EVS().forEach(ev=>(ev.acts||[]).forEach((act,i)=>{if(act.area===AREA&&(act.f||ev.f)===f)o.push({ev,act,i})}));return o}\nconst apoyoDia=()=>LIM&&(dia===0||evActs(SEM[dia]).length>0);\nconst capDia=()=>LIM&&who===1&&dia!==0?240:Math.round(420*(1-(+regla().res)/100));\nfunction rezago(){\n const hoy=SEM[dia],cov=new Set(),out=[];\n Object.keys(MS.days).forEach(k=>{(MS.days[k].plan||[]).forEach(x=>{if(x.oid&&x.s===\"h\")cov.add(x.oid)})});\n Object.keys(MS.days).forEach(k=>{const p=k.split(\"|\");if(p[0]!==\"Limpieza\"||p.length!==2||p[1]>=hoy||p[1]<add(hoy,-14))return;const r=MS.days[k];\n  if(!r||!r.plan||!r.plan.some(x=>[\"h\",\"n\",\"e\"].includes(x.s)))return;\n  r.plan.forEach(x=>{if(x.s!==\"h\"&&!cov.has(p[1]+\"|\"+x.id))out.push({...x,oid:p[1]+\"|\"+x.id,n:\"z\",s:\"p\",q:\"Pendiente del \"+corta(p[1])})})});\n return out}\nconst reqEdad=q=>q.creada?Math.floor((Date.now()-q.creada)/864e5):(q.dias||0);\nconst reqItem=q=>({id:\"req:\"+q.id,rid:q.id,t:q.t,loc:q.loc||null,a:q.a||null,b:q.b||null,n:q.n||\"m\",s:\"p\",q:(q.q||\"Solicitud\")+\" · \"+reqEdad(q)+\" día(s) s().find(z=>z.t===q.t)||{};P.push({id:\"rp:\"+q.id,rpid:q.id,t:q.t+\" (reprogramada)\",loc:ru.loc||null,a:ru.a||null,b:ru.b||null,n:\"r\",s:\"p\",q:\"Reprogramada por Operaciones\",prot:true})})\n plan=P;FIJOS=fijos.reduce((a,x)=>a+x.m,0);\n cola=!LIM?BAN().R.filter(q=>q.s===\"nueva\"&&!q.done&&!q.dup&&q.a).map(q=>({...reqItem(q),q:(q.q||\"Solicitud\")+\" · \"+reqEdad(q)+\" día(s) pendiente\"})):LIM?(who===0?rezago().map(x=>({id:\"z:\"+x.oid,oid:x.oid,t:x.t,loc:x.loc||null,a:x.a,b:x.b,n:\"z\",q:x.q})):[]):[];\n pausas=[{id:\"m\",nom:\"Mañana\",ven:regla().p1,e:0},{id:\"t\",nom:\"Tarde\",ven:regla().p2,e:0}];\n imps=[];ign=new Set()}\nfunction guardar(){MS.days[rkey()]={plan:JSON.parse(JSON.stringify(plan)),cola:cola.map(c=>c.id),ign:[...ign],imps:JSON.parse(JSON.stringify(imps)),pausas:pausas.map(p=>({id:p.id,e:p.e}))}}\nfunction restaurar(){const q=MS.days[rkey()];if(!q)return false;const sv=q.plan||[],m=new Map(sv.map(x=>[String(x.id),x]));\n plan=plan.map(x=>{const z=m.get(String(x.id));return z?{...x,s:z.s,mot:z.mot,ini:z.ini,fin:z.fin,n:z.n}:x});\n const ids=new Set(plan.map(x=>String(x.id)));sv.forEach(x=>{if(!ids.has(String(x.id))&&x.s!==\"p\")plan.push(x)});\n cola=cola.filter(c=>(q.cola||[]).includes(c.id));ign=new Set(q.ign||[]);imps=q.imps||[];pausas.forEach(p=>{const z=(q.pausas||[]).find(y=>y.id===p.id);if(z)p.e=z.e});return true}\nfunction cargar(){base();restaurar();aplicarPM();render()}\nconst dur=(x,k)=>!x.a?0:k===\"c\"?x.b:k===\"o\"?x.a:(x.a+x.b)/2;\nfunction mins(i){if(!i.ini)return 0;const f=i.fin||Date.now();return Math.max(0,Math.round((f-i.ini)/60000))+(i.extra||0)}\nfunction libre(k){const usado=plan.filter(x=>x.s!==\"n\"&&x.s!==\"d\").reduce((a,x)=>a+dur(x,k),0);return capDia()-FIJOS-usado-imps.reduce((a,i)=>a+mins(i),0)}\nfunction analizar(i){\n const m=mins(i),pend=plan.filter(x=>x.s===\"p\"||x.s===\"e\"||x.s===\"o\"),txt=i.t.toLowerCase();\n const directas=pend.filter(x=>x.loc&&x.loc.toLowerCase().split(/[\\s,]+/).some(w=>w.length>3&&txt.includes(w)));\n const subidas=[];directas.forEach(x=>{if(!NIV[x.n]||x.n===\"r\"||x.n===\"e\"||x.n===\"z\")return;const n=x.n===\"b\"?\"m\":x.n===\"m\"?\"a\":x.n;if(n!==x.n){x.n=n;subidas.push(x.t+\" subió a \"+NIV[n][0])}});\n let L=libre(),desp=[];\n if(L<0){let falta=-L;const cand=pend.filter(x=>!x.prot&&x.a).sort((a,b)=>(ORD[a.n]||0)-(ORD[b.n]||0)||dur(b)-dur(a));\n  for(const x of cand){if(falta<=0)break;x.s=\"d\";x.mot=\"Desplazada por imprevisto\";desp.push(x.t);falta-=dur(x)}}\n L=libre();i.res={m,directas:directas.map(x=>x.t),desp,subidas,L,hora:hh(new Date())}}\nfunction renderImps(){\n const el=$(\"#imps\");if(!imps.length){el.innerHTML=\"\";return}\n el.innerHTML=\"<h2>Imprevistos<\/h2>\"+imps.map(i=>{const m=mins(i),r=i.res;\n  if(!i.fin)return `<div class=\"card imp\"><div class=\"row\"><div class=\"t\">${i.t}<\/div><span class=\"lvl\" style=\"--c:var(--terra);font-size:20px\">${fm(m)}<\/span><\/div><div class=\"meta\">En proceso desde las ${hh(new Date(i.ini))}<\/div><button class=\"fill\" data-i=\"${i.id}:fin\" style=\"width:100%;margin-top:12px\">Terminar imprevisto<\/button><\/div>`;\n  const li=a=>a.length?a.join(\", \"):\"ninguna\";\n  return `<div class=\"card imp fin\"><div class=\"row\"><div class=\"t\">${i.t}<\/div><span class=\"lvl\" style=\"--c:var(--baja)\">${fm(m)}<\/span><\/div><div class=\"meta\">Reporte automático · ${r.hora}<\/div><div style=\"margin-top:8px;font-size:15px\"><div><b>Tiempo dedicado:<\/b> ${fm(m)}<\/div><div><b>Tareas afectadas:<\/b> ${li(r.directas.concat(r.desp.filter(x=>!r.directas.includes(x))))}<\/div>${r.desp.length?`<div><b>Pospuestas por falta de tiempo:<\/b> ${li(r.desp)}<\/div>`:\"\"}${r.subidas.length?`<div><b>Prioridad ajustada:<\/b> ${li(r.subidas)}<\/div>`:\"\"}<div><b>Tiempo restante hoy:<\/b> ${r.L>0?fm(r.L):\"sin margen\"}<\/div><\/div><\/div>`}).join(\"\")}\nfunction pub(){guardar();try{const P=window.parent;P.__hoy=P.__hoy||{};const ap=MS.days[AREA+\"|\"+SEM[dia]+\"|a\"];\n P.__hoy[AREA]={fecha:SEM[d ist.length?x.hist.slice().sort((a,b)=>b.f.localeCompare(a.f)).map(h=>{\n if(edH&&edH.id===h.id)return `<div class=\"card\" style=\"margin:6px 0\"><div class=\"grid\"><div><label for=\"ht\">Actividad<\/label><input id=\"ht\" value=\"${q(h.t)}\"><\/div><div><label for=\"hf\">Fecha<\/label><input id=\"hf\" type=\"date\" value=\"${h.f}\"><\/div><div><label for=\"hh\">Horas<\/label><input id=\"hh\" type=\"number\" min=\"0.5\" step=\"0.5\" value=\"${h.h}\"><\/div><div><label for=\"hq\">Quién apoyó<\/label><select id=\"hq\">${QUIEN.map(v=>`<option ${h.q===v?\"selected\":\"\"}>${v}<\/option>`).join(\"\")}<\/select><\/div><div><label for=\"ha\">Autorizó<\/label><select id=\"ha\">${AUT.map(v=>`<option ${h.aut===v?\"selected\":\"\"}>${v}<\/option>`).join(\"\")}<\/select><\/div><\/div><div style=\"display:flex;gap:8px\"><button class=\"ghost\" data-x=\"ch\">Cancelar<\/button><button class=\"fill\" data-sh=\"${x.id}:${h.id}\">Guardar<\/button><\/div><\/div>`;\n return `<div class=\"it\"><span>${h.t}<div class=\"meta\">${fd(h.f)} · ${h.q||\"Sin indicar quién\"} · Autorizó: ${h.aut||\"—\"}<\/div><\/span><span style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\"><b>${n1(h.h)} h<\/b>${delH&&delH.id===h.id?`<span class=\"warn\">¿Eliminar? Se restan sus horas.<\/span><button class=\"danger\" data-dh=\"${x.id}:${h.id}\">Sí<\/button><button class=\"ghost\" data-x=\"nh\">No<\/button>`:`<button class=\"ghost\" data-eh=\"${x.id}:${h.id}\">Editar<\/button><button class=\"danger\" data-xh=\"${x.id}:${h.id}\">Eliminar<\/button>`}<\/span><\/div>`}).join(\"\"):`<div class=\"meta\">Aún sin horas registradas.<\/div>`}\n// ---------- Reporte ----------\nconst kpi=(n,t,c)=>`<div class=\"kpi\" style=\"--c:${c}\"><b>${n}<\/b><span>${t}<\/span><\/div>`;\nfunction vRes(){\n if(dash)return vDash(F.find(x=>x.id===dash));\n const C=F.map(x=>calc(x,ms)),R=C.filter(c=>c.rez>0),T=k=>C.reduce((s,c)=>s+c[k],0);\n const chips=`<div class=\"chips\" role=\"group\" aria-label=\"Mes del reporte\">${Arra function ser(ch){const src=ch.get();if(!src)return null;const out=new Map();
 if(ch.k==="arr")src.forEach(o=>{const b=clone(o);out.set(ch.id(o),{j:canon(b),b})});
 else Object.keys(src).forEach(k=>{if(src[k]===undefined)return;const v=ch.out?ch.out(src[k]):src[k],b={k,v:clone(v)};out.set(hid(k),{j:canon(b),b})});

 const src=ch.get();if(!src)return;const last=SY.last[ch.c]||(SY.last[ch.c]=new Map());
